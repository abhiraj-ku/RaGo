name: Go

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: set up Go
        uses: actions/setup-go@v4
        with:
          go-version-file: go.mod

      - name: lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: latest
          args: ./...

      - name: build
        run: go build ./...

