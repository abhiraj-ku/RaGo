name: Go

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.22'

      - name: lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v2.0
          args: ./...

      - name: build
        run: go build -V ./...

